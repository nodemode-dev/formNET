[package]
name = "formnet-desktop"
version = "0.10.2"
description = "formnet desktop app"
authors = ["NodeAgentc, Inc."]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
getrandom = "0.3"

# macOS: the splash window's rounded mask, the traffic lights centred in the page's title row, the window shown at alpha 0
# behind the splash, and the Edit keys sent to the first responder, through the bindings Tauri's window layer already builds
# (MIT or Apache-2.0 or zlib).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "objc2-core-foundation", "NSColor"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }

# Linux and the BSDs: the main window is on screen at opacity 0 behind the splash until its page has painted (MIT).
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"

# Windows: the server runs in a job object that kills it when the shell's handle closes, so it never outlives the shell
# (MIT or Apache-2.0).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = false

[profile.release.build-override]
strip = false
debug = false
