<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FormNET</title>
  <style>
    html { height: 100%; background: transparent; }
    body { margin: 0; height: 100%; box-sizing: border-box; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 16px; overflow: hidden; color: #a8a8b8; font: 13px -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: calc(50vh - 64px); gap: 18px; }
    svg { display: block; }
    p { margin: 0; height: 16px; line-height: 16px; letter-spacing: 0.2px; }
    .bar { width: 180px; height: 3px; border-radius: 2px; background: #1f1f26; overflow: hidden; }
    .fill { width: 100%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #FFAE2B, #F97316 50%, #FF4F7A); transform-origin: 0 50%; transform: scaleX(0.04); animation: load 2.6s cubic-bezier(0.25, 0.6, 0.35, 1) forwards; }
    .fill.done { animation: none; transform: scaleX(1); transition: transform 0.2s ease-out; }
    @keyframes load { to { transform: scaleX(0.92); } }
  </style>
</head>
<body><svg width="72" height="72" role="img" aria-label="FormNET" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="splash-tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32"><stop offset="0" stop-color="#1C1C22" /><stop offset="1" stop-color="#0A0A0D" /></linearGradient><linearGradient id="splash-rim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16" /><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.03" /><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.07" /></linearGradient><linearGradient id="splash-paint" gradientUnits="userSpaceOnUse" x1="6" y1="0" x2="28" y2="0"><stop offset="0" stop-color="#FFAE2B" /><stop offset="0.5" stop-color="#F97316" /><stop offset="1" stop-color="#FF4F7A" /></linearGradient><radialGradient id="splash-bloom" gradientUnits="userSpaceOnUse" cx="10" cy="16" r="14"><stop offset="0" stop-color="#F97316" stop-opacity="0.22" /><stop offset="1" stop-color="#F97316" stop-opacity="0" /></radialGradient></defs><rect width="32" height="32" rx="7" ry="7" fill="url(#splash-tile)" /><rect width="32" height="32" rx="7" ry="7" fill="url(#splash-bloom)" /><circle cx="9.5" cy="16" r="3" fill="url(#splash-paint)" /><g fill="none" stroke="url(#splash-paint)" stroke-width="2.1" stroke-linecap="round"><path d="M 14.5 11 A 7 7 0 0 1 14.5 21" /><path d="M 18.5 7.5 A 12 12 0 0 1 18.5 24.5" /><path d="M 22.5 4 A 17 17 0 0 1 22.5 28" /></g><rect x="0.2" y="0.2" width="31.6" height="31.6" rx="6.8" ry="6.8" fill="none" stroke="url(#splash-rim)" stroke-width=".4px" /></svg><p>Starting FormNET</p><div class="bar" role="progressbar" aria-label="Starting FormNET"><div class="fill"></div></div><script>
window.formnetSplashDone = function () {
  var fill = document.querySelector('.fill');
  fill.style.transform = getComputedStyle(fill).transform;
  fill.classList.add('done');
  requestAnimationFrame(function () { fill.style.transform = ''; });
};
</script></body>
</html>
